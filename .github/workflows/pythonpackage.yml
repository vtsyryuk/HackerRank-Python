name: Python package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install test and lint dependencies
        run: python -m pip install -r requirements.txt flake8 pytest-cov
      - name: Check syntax and undefined names
        run: python -m flake8 hacker_rank tests --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests and collect coverage
        run: python -m pytest tests --cov=hacker_rank --cov-report=xml:coverage.xml --junitxml=test-results.xml
